label:
  en: "Social media links"
  de: "Social Media Links"
  fr: "Liens des réseaux sociaux"
type: structure
fields:
  platform:
    type: select
    label:
      en: Platform
      de: Plattform
      fr: Plateforme
    options:
      type: query
      query: kirby.option('janheise.kirby-social-media-links.platforms')
  url:
    label:
      en: Link
      de: Link
      fr: Lien
    type: url
    required: true
  target:
    label:
      en: Target
      de: Target
      fr: Target
    type: toggles
    options:
      - value: self
        text: _self
      - value: blank
        text: _blank
      - value: parent
        text: _parent
      - value: top
        text: _top
    default: blank
    reset: false
    required: true
